[package]
name = "infracost"
version = "0.1.0"
edition = "2021"
description = "A Rust client library and CLI for the Infracost Cloud Pricing API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/islamelsayed/infracost-rs"
keywords = ["infracost", "pricing", "cloud", "aws", "gcp"]
categories = ["api-bindings", "command-line-utilities"]

[features]
default = []
blocking = ["tokio/rt"]
cli = ["clap", "anyhow", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "irs"
path = "src/bin/irs.rs"
required-features = ["cli"]

[dependencies]
# GraphQL
cynic = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Async
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Error handling
thiserror = "1"

# CLI (optional)
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = { version = "1", optional = true }

# Tracing
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dotenvy = "0.15"

[build-dependencies]
cynic-codegen = "3"
