type Product {
  productHash: String!
  vendorName: String!
  service: String!
  productFamily: String
  region: String
  sku: String!
  attributes: [Attribute]
  prices(filter: PriceFilter): [Price]
  environmentalMetrics(filter: EnvironmentalMetricFilter): EnvironmentalMetric
}

type EnvironmentalMetric {
  carbonGramsCo2e: Float!
  waterLitres: Float!
  sourceVersion: String!
  effectiveDate: String!
  unit: String!
}

type Attribute {
  key: String!
  value: String
}

input AttributeFilter {
  key: String!
  value: String
  value_regex: String
}

input ProductFilter {
  vendorName: String
  service: String
  productFamily: String
  region: String
  sku: String
  attributeFilters: [AttributeFilter]
}

input PriceFilter {
  purchaseOption: String
  unit: String
  description: String
  description_regex: String
  startUsageAmount: String
  endUsageAmount: String
  termLength: String
  termPurchaseOption: String
  termOfferingClass: String
}

input EnvironmentalMetricFilter {
  effectiveDate: String
}

type Query {
  products(filter: ProductFilter): [Product]
}

