- name: managed-disk/premium-ssd/p1
  display_name: "Premium SSD Managed Disk P1"
  default_region: eastus
  parameters: []
  cost_components:
    - name: storage
      is_primary: true
      unit: month
      default_price: 0.60
      query:
        service: Storage
        product_family: Storage
        attributes:
          - { key: productName, value: Premium SSD Managed Disks }
          - { key: skuName, value: P1 LRS }
          - { key: meterName, value: P1 LRS Disk }
      price_filter:
        purchase_option: Consumption
      pricing_model:
        type: fixed

