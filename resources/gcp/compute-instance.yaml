# GCP Compute Instance pricing - Parameterized
# Uses {{machine_family}} and {{purchase_option}} for dynamic filtering
#
# Supported machine families: N2, E2, N2D, C2, C2D, M1, M2, M3, etc.
# Supported purchase options: OnDemand, Preemptible
#
# The description prefix varies by purchase option:
# - OnDemand: "{{description_prefix}} Instance Core running"
# - Preemptible: "Spot Preemptible {{description_prefix}} Instance Core running"
#
# The builder constructs the full description_prefix parameter based on
# machine_family and purchase_option.

- name: compute-instance
  display_name: "Compute Engine Instance"
  default_region: us-central1
  parameters:
    - { name: cpu_cores, required_for_monthly: true }
    - { name: memory_gib, required_for_monthly: true }
  cost_components:
    - name: cpu
      is_primary: true
      unit: hour
      default_price: 0.031611
      query:
        service: "Compute Engine"
        product_family: Compute
        attributes:
          - { key: resourceGroup, value: CPU }
      post_filter:
        description_starts_with: "{{description_prefix}} Instance Core running"
      price_filter:
        purchase_option: "{{purchase_option}}"
      pricing_model:
        type: linear
        quantity_param: cpu_cores

    - name: memory
      is_primary: false
      unit: gibibyte hour
      default_price: 0.004237
      query:
        service: "Compute Engine"
        product_family: Compute
        attributes:
          - { key: resourceGroup, value: RAM }
      post_filter:
        description_starts_with: "{{description_prefix}} Instance Ram running"
      price_filter:
        purchase_option: "{{purchase_option}}"
      pricing_model:
        type: linear
        quantity_param: memory_gib
