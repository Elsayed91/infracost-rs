# GCP Compute Instance pricing - N2 and E2 machine families
# Each variant has CPU and RAM cost components, split by purchase option.
#
# Note: Both CPU and RAM are priced hourly. The monthly cost is calculated
# in the builder as: (cpu_hourly * 730 * cpu_cores) + (ram_hourly * 730 * memory_gib)

# ============================================================
# N2 (2nd Gen Intel) - On-Demand
# ============================================================
- name: compute-instance/n2
  display_name: "N2 Instance (On-Demand)"
  default_region: us-central1
  parameters:
    - { name: cpu_cores, required_for_monthly: true }
    - { name: memory_gib, required_for_monthly: true }
  cost_components:
    - name: cpu
      is_primary: true
      unit: hour
      default_price: 0.031611
      query:
        service: "Compute Engine"
        product_family: Compute
        attributes:
          - { key: resourceGroup, value: CPU }
      post_filter:
        description_starts_with: "N2 Instance Core running"
      price_filter:
        purchase_option: on_demand
      pricing_model:
        type: linear
        quantity_param: cpu_cores
    - name: ram
      is_primary: false
      unit: gibibyte hour
      default_price: 0.004237
      query:
        service: "Compute Engine"
        product_family: Compute
        attributes:
          - { key: resourceGroup, value: RAM }
      post_filter:
        description_starts_with: "N2 Instance Ram running"
      price_filter:
        purchase_option: on_demand
      pricing_model:
        type: linear
        quantity_param: memory_gib

