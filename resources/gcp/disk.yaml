- name: disk/pd-standard
  display_name: "Storage PD Capacity"
  default_region: us-central1
  parameters:
    - { name: size_gb, required_for_monthly: true }
  cost_components:
    - name: storage
      is_primary: true
      unit: GiB-month
      default_price: 0.04
      query:
        service: "Compute Engine"
        product_family: Storage
        attributes:
          - { key: resourceGroup, value: PDStandard }
      post_filter:
        description_starts_with: "Storage PD Capacity"
        description_excludes:
          - "Confidential Mode"
          - "High Availability"
          - "Storage Pools"
      pricing_model:
        type: linear
        quantity_param: size_gb

