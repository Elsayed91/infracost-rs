- name: forwarding-rule
  display_name: "Forwarding Rule"
  default_region: us-central1
  parameters:
    - { name: data_processed_gb, required_for_monthly: true }
  cost_components:
    - name: uptime
      is_primary: true
      unit: hour
      default_price: 0.025
      query:
        service: Networking
        product_family: Network
        attributes:
          - { key: resourceGroup, value: LoadBalancing }
      post_filter:
        description_contains:
          - "Regional External"
          - "Forwarding Rule Minimum"
      pricing_model:
        type: hourly_to_monthly
    - name: data_processing
      is_primary: false
      unit: GiB
      default_price: 0.008
      query:
        service: Networking
        product_family: Network
        attributes:
          - { key: resourceGroup, value: LoadBalancing }
      post_filter:
        description_contains:
          - "Regional External"
          - "Outbound Data Processing"
      pricing_model:
        type: linear
        quantity_param: data_processed_gb
