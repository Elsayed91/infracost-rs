- name: ebs/gp3
  display_name: "General Purpose SSD (gp3)"
  default_region: us-east-1
  parameters:
    - { name: size_gb, required_for_monthly: true }
  cost_components:
    - name: storage
      is_primary: true
      unit: GB-month
      default_price: 0.08
      query:
        service: AmazonEC2
        product_family: Storage
        attributes:
          - { key: volumeApiName, value: gp3 }
          - { key: servicecode, value: AmazonEC2 }
      pricing_model:
        type: linear
        quantity_param: size_gb

    - name: iops
      is_primary: false
      unit: IOPS-month
      default_price: 0.005
      query:
        attributes:
          - { key: group, value: "EBS IOPS" }
          - { key: volumeApiName, value: gp3 }
          - { key: servicecode, value: AmazonEC2 }
      pricing_model:
        type: linear_with_baseline
        quantity_param: iops
        baseline: 3000

    - name: throughput
      is_primary: false
      unit: MiBps-month
      default_price: 0.04
      query:
        attributes:
          - { key: group, value: "EBS Throughput" }
          - { key: volumeApiName, value: gp3 }
          - { key: servicecode, value: AmazonEC2 }
      price_transform:
        divide_by: 1024.0
      pricing_model:
        type: linear_with_baseline
        quantity_param: throughput_mibps
        baseline: 125

