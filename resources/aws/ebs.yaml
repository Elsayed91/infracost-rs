- name: ebs/io2
  display_name: "Provisioned IOPS SSD (io2)"
  default_region: us-east-1
  parameters:
    - { name: size_gb, required_for_monthly: true }
  cost_components:
    - name: storage
      is_primary: true
      unit: GB-month
      default_price: 0.125
      query:
        service: AmazonEC2
        product_family: Storage
        attributes:
          - { key: volumeApiName, value: io2 }
          - { key: servicecode, value: AmazonEC2 }
      pricing_model:
        type: linear
        quantity_param: size_gb

    - name: iops
      is_primary: false
      unit: IOPS-month
      default_price: 0.065
      query:
        attributes:
          - { key: group, value: "EBS IOPS" }
          - { key: volumeApiName, value: io2 }
          - { key: servicecode, value: AmazonEC2 }
      pricing_model:
        type: tiered
        quantity_param: iops
        tiers:
          - limit: 32000
            default_price: 0.065
            query_filter:
              attribute_regex:
                key: description
                pattern: ".*tier 1|^((?!tier).)*$"
          - limit: 64000
            default_price: 0.0455
            query_filter:
              attribute_regex:
                key: description
                pattern: "tier 2"
          - limit: null
            default_price: 0.03185
            query_filter:
              attribute_regex:
                key: description
                pattern: "tier 3"

