- name: nat-gateway
  display_name: "NAT Gateway"
  default_region: us-east-1
  parameters:
    - { name: data_processed_gb, required_for_monthly: false }
  cost_components:
    - name: uptime
      is_primary: true
      unit: hour
      default_price: 0.045
      query:
        product_family: "NAT Gateway"
      post_filter:
        usagetype_ends_with: "NatGateway-Hours"
      pricing_model:
        type: hourly_to_monthly

    - name: data_processing
      is_primary: false
      unit: GB
      default_price: 0.045
      query:
        product_family: "NAT Gateway"
      post_filter:
        usagetype_ends_with: "NatGateway-Bytes"
      pricing_model:
        type: linear
        quantity_param: data_processed_gb
