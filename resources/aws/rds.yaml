# RDS Instance compute - uses string params like ec2-instance
- name: rds
  display_name: "RDS Database Instance"
  default_region: us-east-1
  parameters:
    - { name: engine, required_for_monthly: false }
    - { name: instance_class, required_for_monthly: false }
    - { name: deployment_option, required_for_monthly: false }
  cost_components:
    - name: instance
      is_primary: true
      unit: hour
      default_price: 0.017
      query:
        service: AmazonRDS
        product_family: Database Instance
        attributes:
          - { key: databaseEngine, value: "{{engine}}" }
          - { key: instanceType, value: "{{instance_class}}" }
          - { key: deploymentOption, value: "{{deployment_option}}" }
      price_filter:
        purchase_option: on_demand
      pricing_model:
        type: hourly_to_monthly

# GP3 storage components
- name: rds-storage/gp3
  display_name: "RDS GP3 Storage"
  default_region: us-east-1
  parameters:
    - { name: allocated_storage_gb, required_for_monthly: true }
    - { name: iops, required_for_monthly: false }
    - { name: storage_throughput_mbps, required_for_monthly: false }
  cost_components:
    - name: storage
      is_primary: true
      unit: GB-month
      default_price: 0.115
      query:
        service: AmazonRDS
        product_family: Database Storage
        attributes:
          - { key: databaseEngine, value: "{{engine}}" }
          - { key: volumeType, value: "General Purpose-GP3" }
          - { key: deploymentOption, value: "{{deployment_option}}" }
      pricing_model:
        type: linear
        quantity_param: allocated_storage_gb

    - name: iops
      is_primary: false
      unit: IOPS-month
      default_price: 0.02
      query:
        service: AmazonRDS
        product_family: Provisioned IOPS
        attributes:
          - { key: databaseEngine, value: "{{engine}}" }
          - { key: groupDescription, value: "RDS Provisioned GP3 IOPS" }
          - { key: deploymentOption, value: "{{deployment_option}}" }
      pricing_model:
        type: linear_with_baseline
        quantity_param: iops
        baseline: 3000

    - name: throughput
      is_primary: false
      unit: MBps-month
      default_price: 0.08
      query:
        service: AmazonRDS
        product_family: Provisioned Throughput
        attributes:
          - { key: databaseEngine, value: "{{engine}}" }
          - { key: deploymentOption, value: "{{deployment_option}}" }
      pricing_model:
        type: linear_with_baseline
        quantity_param: storage_throughput_mbps
        baseline: 125

